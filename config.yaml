# CourseTransform 通用配置
# 所有与特定教材或模板绑定的内容都不在此文件中硬编码，均可通过修改本文件适配新材料。

llm:
  # OpenAI 兼容接口：填服务地址 + 模型名 + 存放 key 的环境变量名
  # 示例：DeepSeek https://api.deepseek.com/v1；OpenAI 官方 https://api.openai.com/v1；
  #       通义 https://dashscope.aliyuncs.com/compatible-mode/v1；智谱 https://open.bigmodel.cn/api/paas/v4；
  #       本地 Ollama http://localhost:11434/v1；vLLM http://localhost:8000/v1
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "LLM_API_KEY"   # 从该环境变量读取 API Key，未设置时本地服务可用 EMPTY
  temperature: 0.3
  timeout_seconds: 120
  max_retries: 3               # 请求失败时的最大重试次数（指数退避）

vision:
  # 视觉模型（stage1 图片描述用），结构与 llm 相同；enabled=false 时图片描述返回空
  enabled: false
  base_url: "http://localhost:8000/v1"
  model: "qwen2.5-vl"
  api_key_env: "VISION_API_KEY"
  timeout_seconds: 180
  max_retries: 2
  prompt: "请用中文描述这张图片的内容。如果是公式请用 LaTeX，如果是表格请用 Markdown 表格，如果是示意图请说明含义。"

stage1:
  # 章节切分：匹配行首的章标题正则，可按教材实际格式修改（如 Chapter 开头的英文教材）
  chapter_pattern: "^第[0-9一二三四五六七八九十百]+章"
  # 忽略目录页中形如 第N章 省略号 页码 的误判行
  ignore_toc_lines: true
  # 图片输出目录名（位于输出目录下）与文件名前缀
  image_dir: "images"
  image_prefix: "image-"
  image_format: "jpg"
  # 图题注行的匹配正则，用于把图片引用插到题注附近
  caption_pattern: "^图\\s*[0-9]+[-.][0-9]+"
  # 图片过滤：宽或高小于该像素的装饰性小图跳过
  min_image_size: 32
  # 是否调用视觉模型生成图片描述（需要 vision.enabled=true）
  use_vision: false

stage2:
  # 教学过程各环节时间合计的目标分钟数；设为 0 表示不做时间合计检查
  total_minutes: 45
  # AI 验证回环的最大重生成轮数
  max_validation_rounds: 2
  # 模板中待填项的标记字符串（表格或段落中出现则视为待填）
  fill_markers: ["____"]
  # 回填 docx 时强制设置的东亚字体；留空表示完全沿用模板原字体
  east_asia_font: ""
  # 模型输出的表格行列数与原表不符时，带纠错信息重试一次
  table_retry_on_shape_mismatch: true
  # 上下文摘要长度（前一已生成块送入下一个 prompt 的最大字符数）
  summary_length: 300

validation:
  # 自定义检查项（列表中的每条都会交给裁判模型逐项判定）；留空则使用内置默认检查表
  checkitems: []

paths:
  input_dir: "input"
  output_dir: "output"
